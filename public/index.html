<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description"
          content="This page informs users about the state of a certain person saying 'Yusu'. This information should be regarded with the utmost importance." />
    <meta name="keywords" content="yusu" />
    <link rel="stylesheet" href="./style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:wght@500;700&display=swap" rel="stylesheet" />
    <title>ZeiManYusu?</title>
  </head>
  <body>
    <section class="yusu-container">
      <h1 class="yusu-text">Man heeft wel degelijk yusu gezegd</h1>

      <div class="counter" aria-live="polite">
        <p class="counter-number" id="count">–</p>
        <p class="counter-label" id="count-label">keer vandaag</p>
        <button class="counter-button" id="plus" type="button">+1 yusu</button>
        <p class="counter-reset">Reset om 00:00 Nederlandse tijd · nog <span id="countdown">--:--:--</span></p>
        <p class="counter-status" id="status"></p>
      </div>

      <ol class="history" id="history" aria-label="Vorige dagen"></ol>
    </section>

    <script src="./counter.js"></script>
  </body>
</html>
